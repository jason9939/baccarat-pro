<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baccarat Trend Analyzer Pro</title>

<!-- Telegram Web App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    background:#0b0b0b;
    color:#eee;
    font-family:Arial;
    text-align:center;
    padding:20px;
}
h1{color:gold}

button{
    padding:12px 26px;
    font-size:18px;
    margin:6px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.banker{background:#b33939;color:#fff}
.player{background:#227093;color:#fff}
.tie{background:#218c74;color:#fff}
.reset{background:#84817a;color:#fff}

.panel{
    background:#1c1c1c;
    margin-top:15px;
    padding:15px;
    border-radius:8px;
}

.danger{color:red;font-weight:bold}
.good{color:#2ecc71;font-weight:bold}
</style>
</head>

<body>

<!-- ====== 非 Telegram 打开直接拦截 ====== -->
<div id="blocked" style="display:none;margin-top:80px;">
    <h2 style="color:red;">禁止访问</h2>
    <p>请从 Telegram 官方 Bot 打开本系统</p>
</div>

<!-- ====== 登录界面 ====== -->
<div id="loginBox" style="display:none;max-width:360px;margin:60px auto;background:#111;padding:20px;border-radius:10px;">
    <h2 style="color:gold;">系统登录</h2>
    <p>请输入 6 位访问密码</p>
    <input id="pwd" maxlength="6" placeholder="******"
           style="padding:10px;width:80%;font-size:18px;text-align:center;">
    <br><br>
    <button onclick="login()">登录</button>
    <div id="loginMsg" style="margin-top:10px;color:red;"></div>
</div>

<!-- ====== 主系统 ====== -->
<div id="app" style="display:none;">

<h1>Baccarat Trend Analyzer · PRO</h1>

<div>
    <button class="banker" onclick="add('B')">庄</button>
    <button class="player" onclick="add('P')">闲</button>
    <button class="tie" onclick="add('T')">和</button>
    <button class="reset" onclick="resetAll()">重置</button>
</div>

<div class="panel">
    <div id="round">局数：0</div>
    <div id="pattern">识别形态：-</div>
    <div id="predict">预测方向：-</div>
    <div id="risk">系统状态：-</div>
</div>

</div>

<script>
// ================== 配置 ==================
const API_URL = "http://localhost:3000"; // ← 改成你的后端地址

// ================== Telegram 限制 ==================
if (!window.Telegram || !Telegram.WebApp) {
    document.getElementById("blocked").style.display = "block";
    throw new Error("Not Telegram WebApp");
}

Telegram.WebApp.ready();
Telegram.WebApp.expand();

const tgUser = Telegram.WebApp.initDataUnsafe.user;
const tgId = tgUser.id;

// 显示登录
document.getElementById("loginBox").style.display = "block";

// ================== 登录 ==================
function login(){
    const pwd = document.getElementById("pwd").value;
    const msg = document.getElementById("loginMsg");

    if(pwd.length !== 6){
        msg.innerText = "密码必须是 6 位";
        return;
    }

    fetch(API_URL + "/login", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ tgId, password: pwd })
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.ok){
            document.getElementById("loginBox").style.display="none";
            document.getElementById("app").style.display="block";
        }else{
            msg.innerText = d.msg + "｜请联系客服";
        }
    });
}

// ================== 系统逻辑（与你原本一致） ==================
let history=[];
let lastPrediction=null;
let failCount=0;

function add(r){
    history.push(r);
    analyze();
}

function analyze(){
    document.getElementById("round").innerText="局数："+history.length;
}
function resetAll(){
    history=[];
    document.getElementById("round").innerText="局数：0";
}
</script>

</body>
</html>
// 示例：后端模拟用户数据
const users = [
  { tgId: 123456789, password: "123456", trial: true }
];
